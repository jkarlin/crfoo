<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HDR Ad UseCounter Test</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, sans-serif;
    }
    h1 {
      font-size: 1.5rem;
    }
    iframe {
      width: 600px;
      height: 450px;
      border: 2px solid #444;

  <h1>HDR Ad UseCounter Test</h1>
