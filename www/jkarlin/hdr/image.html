<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>St. Kentigern's Church HDR Test</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, sans-serif;
    }
    .ad-frame {
      width: 600px;
      height: 400px;
      border: 2px solid #444;
      border-radius: 8px;
      overflow: hidden;
      background-color: #000;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>

  <h1>St. Kentigern's Church (Fitted to Frame)</h1>

  <div class="ad-frame">
    <!-- srcdoc wraps the image so it fits the 600x400 iframe cleanly -->
    <iframe srcdoc="<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;}img{max-width:100%;max-height:100%;object-fit:contain;}</style></head><body><img src='https://upload.wikimedia.org/wikipedia/commons/2/26/St_Kentigerns_Church_HDR_%288226826999%29.jpg' /></body></html>" src="about:blank?ad_filterlist_demo_param=1"></iframe>
  </div>

</body>
</html>
