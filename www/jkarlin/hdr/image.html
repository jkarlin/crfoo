<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HDR vs Standard Dynamic Range</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #050505;
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
    }

    .container {
      display: flex;
      gap: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
      max-width: 45%;
    }

    .card h2 {
      font-size: 1.2rem;
      margin: 0;
    }

    img {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.8);
    }

    /* Standard SDR limits */
    .sdr {
      dynamic-range: standard;
      filter: opacity(0.85); /* Slightly dimmed to accentuate the HDR contrast */
    }

    /* Super bright HDR styling */
    .hdr {
      dynamic-range: high;
      /* Boost exposure and contrast to push brightness into display highlight headroom */
      filter: brightness(1.6) contrast(1.15) saturate(1.1);
      /* Force mixing using Rec. 2020 ultra-wide color space */
      color-interpolation-filters: rec2020;
    }

    /* Extra headroom push on HDR-capable screens */
    @media (dynamic-range: high) {
      .hdr {
        /* Unlocks maximum display luminance highlights on supporting browsers */
        filter: brightness(2.0) contrast(1.25);
      }
    }
  </style>
</head>
<body>

  <h1>HDR vs SDR Comparison</h1>

  <div class="container">
    <div class="card">
      <h2>Super Bright HDR</h2>
      <img class="hdr" 
           src="https://upload.wikimedia.org/wikipedia/commons/8/89/StLouisArchMultExpEV%2B1.51.JPG" 
           alt="St. Louis Arch - Super Bright HDR">
    </div>

    <div class="card">
      <h2>Standard SDR</h2>
      <img class="sdr" 
           src="https://upload.wikimedia.org/wikipedia/commons/8/89/StLouisArchMultExpEV%2B1.51.JPG" 
           alt="St. Louis Arch - Standard Dynamic Range">
    </div>
  </div>

</body>
</html>
