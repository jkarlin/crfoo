<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>UltraHDR vs Forced SDR Mode</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 650px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    iframe, img {
      width: 100%;
      height: 400px;
      border: 2px solid #444;
      border-radius: 8px;
      object-fit: contain;
      background-color: #000;
      box-sizing: border-box;
    }
    /* Force Chrome to ignore the gainmap and render in standard SDR */
    .force-sdr {
      dynamic-range-limit: standard;
    }
  </style>
</head>
<body>

  <h1>UltraHDR vs Forced SDR Mode</h1>

  <div class="container">
    <!-- Top Card: UltraHDR Image in Full HDR Mode (Ad Frame) -->
    <div class="card">
      <h2>1. UltraHDR Image (Full HDR Gainmap Boost)</h2>
      <iframe srcdoc="<!DOCTYPE html><html><head><style>html,body{margin:0;padding:0;width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden;}img{max-width:100%;max-height:100%;object-fit:contain;}</style></head><body><img src='https://github.com/MishaalRahmanGH/Ultra_HDR_Samples/blob/main/Originals/Ultra_HDR_Samples_Originals_05.jpg?raw=true&ad_filterlist_demo_param=1' /></body></html>"></iframe>
    </div>

    <!-- Bottom Card: Same UltraHDR Image Forced to SDR Mode via CSS -->
    <div class="card">
      <h2>2. Same Image Forced to SDR Mode (dynamic-range-limit: standard)</h2>
      <img class="force-sdr" src="https://github.com/MishaalRahmanGH/Ultra_HDR_Samples/blob/main/Originals/Ultra_HDR_Samples_Originals_05.jpg?raw=true" alt="Forced SDR">
    </div>
  </div>

</body>
</html>
