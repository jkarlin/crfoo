<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wikipedia St. Kentigern's Church HDR Test</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, sans-serif;

      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      max-width: 700px;

      width: 100%;
      height: 500px;

      border-radius: 8px;

    }
  </style>
</head>
<body>

  <h1>St. Kentigern's Church Image (Ad Frame)</h1>

  <div class="card">
    <!-- Ad-tagged iframe loading the direct Wikimedia image -->
    <iframe src="https://upload.wikimedia.org/wikipedia/commons/2/26/St_Kentigerns_Church_HDR_%288226826999%29.jpg?ad_filterlist_demo_param=1"></iframe>
  </div>

</body>
</html>
