<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>HDR vs SDR Side-by-Side Test</title>
  <style>
    body {
      margin: 0;
      padding: 2rem;
      background-color: #121212;
      color: #ffffff;
      font-family: system-ui, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 2rem;
      max-width: 650px;
    }
    .card {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    iframe, img {
      width: 100%;
      height: 400px;
      border: 2px solid #333;
      border-radius: 8px;
      object-fit: cover;
      background-color: #000;
    }
  </style>
</head>
<body>

  <h1>HDR vs SDR Comparison</h1>

  <div class="container">
    <!-- Top Card: UltraHDR Gainmap (in Ad Iframe) -->
    <div class="card">
      <h2>1. UltraHDR Gainmap Image (Ad Frame)</h2>
      <iframe src="https://raw.githubusercontent.com/MishaalRahmanGH/Ultra_HDR_Samples/main/Originals/PXL_20231005_231908008.MP.jpg?ad_filterlist_demo_param=1"></iframe>
    </div>

    <!-- Bottom Card: Standard SDR Version (Same Photo) -->
    <div class="card">
      <h2>2. Standard SDR Image (Same Photo, No Gainmap)</h2>
      <img src="https://raw.githubusercontent.com/MishaalRahmanGH/Ultra_HDR_Samples/main/SDR%20Emulation/PXL_20231005_231908008.MP_base.jpg" alt="SDR Base Image">
    </div>
  </div>

</body>
</html>
